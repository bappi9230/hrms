---
grails:
    profile: web
    codegen:
        defaultPackage: hrms
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    servlet:
        multipart:
            max-file-size: 2MB
            max-request-size: 3MB
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback-spring.xml'
                - '*.properties'
environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'
    production:
        management:
            endpoints:
                enabled-by-default: false

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.h2.Driver
    username: sa
    password: ''

environments:
    development:
        dataSource:
            dbCreate: update
            url: jdbc:h2:file:./devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    test:
        dataSource:
            dbCreate: update
            url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    production:
        dataSource:
            dbCreate: none
            url: jdbc:h2:./prodDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE

---
# ---------------------------------------------------------------
# Day 1: Spring Security
# ---------------------------------------------------------------
grails:
    plugin:
        springsecurity:
            userLookup:
                userDomainClassName: hrms.User
                authorityJoinClassName: hrms.UserRole
            authority:
                className: hrms.Role
            auth:
                loginFormUrl: /auth/login
            failureHandler:
                defaultFailureUrl: /auth/login?login_error=1
            successHandler:
                defaultTargetUrl: /
            adh:
                errorPage: /auth/denied
            logout:
                postOnly: false
                afterLogoutUrl: /auth/login
            controllerAnnotations:
                staticRules:
                    - { pattern: '/assets/**',     access: ['permitAll'] }
                    - { pattern: '/**/favicon.ico', access: ['permitAll'] }
                    - { pattern: '/error',          access: ['permitAll'] }
                    - { pattern: '/notFound',       access: ['permitAll'] }
                    - { pattern: '/login/**',       access: ['permitAll'] }
                    - { pattern: '/logoff',         access: ['permitAll'] }
                    - { pattern: '/actuator/**',    access: ['ROLE_ADMIN'] }
---
# ---------------------------------------------------------------
# Day 6: company details (payslip PDF, bank advice) and mail sender
# Mail server is NOT configured here: set env vars SPRING_MAIL_HOST (and SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true). Without a host, the email buttons stay disabled.
# ---------------------------------------------------------------
hrms:
    company:
        name: 'HRMS Demo Ltd.'
        bankName: ''          # e.g. 'Dutch-Bangla Bank Ltd., Motijheel Branch'
        accountNo: ''         # company account the salary is debited from
    mail:
        from: 'no-reply@hrms.local'
